; Mobile port groundwork (CLAUDE.md Phase 12). Body textures are 8K sources in TEXTUREGROUP_World;
; phones and standalone headsets cook/stream them at most 2K. Other groups inherit the engine
; defaults (UDeviceProfile::ValidateTextureLODGroups fills unspecified groups from the parent).
; The render budget (astro.Render.Budget auto) selects MobileCVars on Android/iOS, or VRCVars
; when stereo is on (standalone Quest).

[Android DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)

[IOS DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
